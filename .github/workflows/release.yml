name: Release

on:
  push:
    tags:
      - "*"
  # Manual run: releases the version in manifest.json (the tag is created by gh).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="$(node -p 'require("./manifest.json").version')"; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title="$tag" --generate-notes main.js manifest.json styles.css
